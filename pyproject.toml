[project]
name = "pm-assistant"
version = "0.1.0"
description = "Project-manager chatbot: LangGraph agent that routes information questions to a RAG + Knowledge Graph subgraph and actions to an MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2.16,<1.3",
    "langchain>=1.4.6,<1.5",
    "langchain-core>=1.6.12,<2",
    "langchain-anthropic>=1.7.6,<2",
    "langchain-mcp-adapters==0.3.2",
    "mcp>=1.30.0,<2",
    "networkx>=3.7,<4",
    "rank-bm25==0.2.2",
    "gradio>=6.30.0,<7",
]

[project.scripts]
pm-chat = "pm_assistant.ui.cli:main"
pm-gradio = "pm_assistant.ui.gradio_app:main"
pm-mcp-server = "pm_assistant.mcp_server.__main__:main"
pm-assistant-mcp = "pm_assistant.agent_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "langgraph-cli[inmem]>=0.4.37",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
